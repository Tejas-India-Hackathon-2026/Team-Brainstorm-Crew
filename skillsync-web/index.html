<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SkillSync Pro | AI-Powered On-Demand Home Services & Diagnostics</title>
  <meta name="description" content="Instant certified plumbers, electricians, AC repair, and appliance technicians. Features multimodal AI problem diagnosis, live GPS tracking, and safety OTP verification." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563EB'><path d='M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'/></svg>" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-root">
    <!-- Top Sticky Header -->
    <header class="app-header">
      <div class="header-inner">
        <!-- Logo -->
        <div class="brand-logo-wrap" onclick="window.skillsyncApp && window.skillsyncApp.customerHome && window.skillsyncApp.customerHome.render()">
          <div class="brand-icon-box">
            <i data-lucide="wrench"></i>
          </div>
          <div class="brand-text-block">
            <span class="brand-title">SkillSync <span>PRO</span></span>
            <span class="brand-tagline">AI Home Services</span>
          </div>
        </div>

        <!-- Role Switcher (Customer <-> Technician) -->
        <div id="role-switcher-toggle"></div>

        <!-- Desktop Navigation Links -->
        <nav class="header-nav" id="top-nav-links"></nav>

        <!-- Header Utilities (SOS, Theme, Profile) -->
        <div class="header-utils">
          <button class="btn btn-danger-sos" id="global-sos-btn" title="Emergency Safety Panic Button">
            <i data-lucide="shield-alert"></i>
            <span>SOS</span>
          </button>

          <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light / Dark Mode">
            <i data-lucide="moon" id="theme-icon"></i>
          </button>

          <div class="user-avatar-pill">
            <div class="user-mini-avatar">AS</div>
            <span class="user-mini-name">Abhishek</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main View Container -->
    <main class="main-content" id="main-app-content">
      <!-- Dynamic Views Rendered by App Router -->
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav"></nav>

    <!-- Global Toast Alerts Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- Main ES Module Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
